# Deploy https://vhrd.tech/: build the live site and the notify service, then, once approved in the production
# environment, upload both to the server with rsync. Started by hand only: Actions > Deploy vhrd.tech > Run workflow,
# on main. How it is set up and why (keys, environment, the server's ci-site and ci-notify users): AGENTS.md "Deploy"
# and "Notify service".
#
# The build jobs have no secrets. Only the deploy job gets the SSH keys, and it runs nothing from the repo but the
# post-deploy check after the keys are gone. On the server each key can only write into one folder (rrsync -wo):
# ci-site into the site's, ci-notify into an upload folder that the service's user checks and activates from.

name: Deploy vhrd.tech

on:
  workflow_dispatch:
    inputs:
      notify:
        description: Build and ship the notify service even when it has not changed since the live release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"
  DEPLOY_HOST: vhrd.tech
  DEPLOY_PORT: "7722"
  DEPLOY_USER: ci-site
  NOTIFY_USER: ci-notify
  # the notify service's toolchain; a bump is a commit here, checked with `just test` on that version first
  RUST_TOOLCHAIN: "1.99.1"
  MUSL: x86_64-unknown-linux-musl

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stamp: ${{ steps.pack.outputs.stamp }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zola (pinned, checked by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/zola.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP" zola
          "$RUNNER_TEMP/zola" --version

      # The same as `just live`, with the footer stamp the justfile would set.
      - name: Build the live site
        run: |
          export VHRD_GIT="$(git describe --always --dirty --abbrev=7)"
          export VHRD_BUILT="$(git log -1 --format=%cd --date=format:'%-d %b %Y')"
          "$RUNNER_TEMP/zola" check --skip-external-links
          "$RUNNER_TEMP/zola" build --base-url "https://vhrd.tech/" --output-dir target/live
          python3 tools/check_live.py built target/live --stamp "$VHRD_GIT"
          echo "VHRD_GIT=$VHRD_GIT" >> "$GITHUB_ENV"

      - name: Pack
        id: pack
        run: |
          case "$VHRD_GIT" in *-dirty) echo "the tree is dirty"; exit 1;; esac
          tar cf "$RUNNER_TEMP/site.tar" -C target/live .
          echo "stamp=$VHRD_GIT" >> "$GITHUB_OUTPUT"
          echo "digest=$(sha256sum "$RUNNER_TEMP/site.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site.tar
          retention-days: 7
          if-no-files-found: error

  # The notify service as a static musl binary, with the settings it ships with and the server-side files root
  # installs by hand (the activator, also static, and the units). It is built and shipped only when something
  # that feeds it changed since the release that answers on https://vhrd.tech/api/notify; the server's activator
  # restarts the service for each new release. No cache: the build takes a minute or two, and a cache shared with
  # other runs would be one more input.
  build-notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # "true": the release below is uploaded; "false": the live release `git` stays and nothing is uploaded
      ship: ${{ steps.plan.outputs.ship }}
      git: ${{ steps.pack.outputs.git || steps.plan.outputs.git }}
      version: ${{ steps.pack.outputs.version }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      # The whole history, for the ancestor check below
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Ship the service unless it is unchanged since the release that answers on https://vhrd.tech/api/notify:
      # tools/notify_plan.py says when that is (an ancestor, no change outside its site-only paths) and why.
      # Anything unclear ships it, and the input `notify` forces it.
      - name: Does the notify service need shipping
        id: plan
        env:
          FORCE: ${{ inputs.notify }}
        run: python3 tools/notify_plan.py --force="$FORCE"

      # rustup checks each component's sha256 from the channel manifest
      - name: Install Rust (pinned) with the musl target
        if: steps.plan.outputs.ship == 'true'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$MUSL"
          cargo "+$RUST_TOOLCHAIN" --version

      - name: Test
        if: steps.plan.outputs.ship == 'true'
        run: cargo "+$RUST_TOOLCHAIN" test --locked --workspace

      - name: Build
        if: steps.plan.outputs.ship == 'true'
        run: cargo "+$RUST_TOOLCHAIN" build --locked --release --target "$MUSL" -p vhrd_notify_cli -p vhrd_notify_activate

      # The release's name and git sha come from the binary's own --version, the same words the server checks.
      # The sha256 of every file goes into the run's summary too: root checks the activator against it.
      - name: Pack
        id: pack
        if: steps.plan.outputs.ship == 'true'
        run: |
          bin="target/$MUSL/release/vhrd_notify"
          act="target/$MUSL/release/vhrd_notify_activate"
          for b in "$bin" "$act"; do
            if readelf -l "$b" | grep -q INTERP; then echo "$b is not static"; exit 1; fi
          done
          line="$("$bin" --version)"
          echo "$line"
          read -r name version git _ <<< "${line//[(,]/ }"
          [ "$name" = vhrd_notify ] || { echo "unexpected --version: $line"; exit 1; }
          [[ "$version" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}$ ]] || { echo "bad version: $version"; exit 1; }
          [[ "$git" =~ ^[0-9a-f]{7,12}$ ]] || { echo "bad or dirty git sha: $git"; exit 1; }
          out="$RUNNER_TEMP/notify"
          mkdir -p "$out/setup"
          cp "$bin" "$out/vhrd_notify"
          cp deploy/notify.toml "$out/notify.toml"
          cp "$act" deploy/vhrd-notify-activate.path deploy/vhrd-notify-activate.service deploy/vhrd-notify.service \
            "$out/setup/"
          (cd "$out" && sha256sum vhrd_notify notify.toml setup/*) | tee "$RUNNER_TEMP/sums"
          {
            echo "### vhrd_notify $version ($git)"
            echo '```'
            cat "$RUNNER_TEMP/sums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tar cf "$RUNNER_TEMP/notify.tar" -C "$out" .
          {
            echo "git=$git"
            echo "version=$version"
            echo "digest=$(sha256sum "$RUNNER_TEMP/notify.tar" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.ship == 'true'
        with:
          name: notify
          path: ${{ runner.temp }}/notify.tar
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build, build-notify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://vhrd.tech/
    permissions:
      contents: read
    steps:
      # Deny by default: only the people in the repository variable DEPLOY_ACTORS (logins, space separated) deploy.
      - name: Who started it
        env:
          ACTORS: ${{ vars.DEPLOY_ACTORS }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          [ -n "$ACTOR" ] || exit 1
          case " $ACTORS " in
            *" $ACTOR "*) echo "started by $ACTOR" ;;
            *) echo "$ACTOR may not deploy (DEPLOY_ACTORS: '$ACTORS')"; exit 1 ;;
          esac

      # A re-run of an old run would deploy an old commit: roll back with a revert commit on main instead.
      - name: Still the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          [ "$head" = "$SHA" ] || { echo "main is at $head now, this run built $SHA: start a new run"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/deploy
            deploy/old-urls.txt
            deploy/redirects.map
            tools/check_live.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/artifact

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build-notify.outputs.ship == 'true'
        with:
          name: notify
          path: ${{ runner.temp }}/artifact

      - name: Unpack the build it approved
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "${DIGEST}  $RUNNER_TEMP/artifact/site.tar" | sha256sum -c -
          mkdir "$RUNNER_TEMP/site"
          tar xf "$RUNNER_TEMP/artifact/site.tar" -C "$RUNNER_TEMP/site"

      # The manifest is written here, not in the build: its seq (run number and attempt) must grow with a re-run of
      # this job too, or the server would take a retry for the old upload and ignore it.
      - name: Unpack the notify release it approved
        if: needs.build-notify.outputs.ship == 'true'
        env:
          DIGEST: ${{ needs.build-notify.outputs.digest }}
          VERSION: ${{ needs.build-notify.outputs.version }}
          GIT: ${{ needs.build-notify.outputs.git }}
        run: |
          echo "${DIGEST}  $RUNNER_TEMP/artifact/notify.tar" | sha256sum -c -
          [[ "$VERSION" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}$ && "$GIT" =~ ^[0-9a-f]{7,12}$ ]] || exit 1
          n="$RUNNER_TEMP/notify"
          mkdir "$n"
          tar xf "$RUNNER_TEMP/artifact/notify.tar" -C "$n"
          seq=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          bin_sha="$(sha256sum "$n/vhrd_notify" | cut -d' ' -f1)"
          config_sha="$(sha256sum "$n/notify.toml" | cut -d' ' -f1)"
          printf 'format = 1\nname = "vhrd_notify"\nversion = "%s"\ngit = "%s"\nseq = %d\n[files]\nvhrd_notify = "%s"\n"notify.toml" = "%s"\n' \
            "$VERSION" "$GIT" "$seq" "$bin_sha" "$config_sha" > "$n/manifest.toml"
          cat "$n/manifest.toml"

      # The service goes first: a new consent version or list must be in the service before the site's forms send
      # it (AGENTS.md "Notify service"), so a release that does not go live stops the run before the site changes.
      # rsync to the ci-notify user, whose key the server forces into `rrsync -wo -no-del -munge` on its upload
      # folder. The binary, the settings and the files for root go first, the manifest last and on its own: the
      # server's activator starts when the manifest changes, and takes nothing that does not match it.
      - name: Upload the notify release
        if: needs.build-notify.outputs.ship == 'true'
        env:
          NOTIFY_SSH_KEY: ${{ secrets.NOTIFY_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$NOTIFY_SSH_KEY" > "$RUNNER_TEMP/notify_key"
          ssh="ssh -p $DEPLOY_PORT -i $RUNNER_TEMP/notify_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/deploy/known_hosts \
            -o ConnectTimeout=30"
          n="$RUNNER_TEMP/notify"
          rsync --recursive --checksum --perms --chmod=D750,F640 --omit-dir-times --stats -e "$ssh" \
            "$n/vhrd_notify" "$n/notify.toml" "$n/setup" "$NOTIFY_USER@$DEPLOY_HOST:/"
          rsync --checksum --perms --chmod=F640 -e "$ssh" "$n/manifest.toml" "$NOTIFY_USER@$DEPLOY_HOST:/"

      - name: Forget the notify key
        if: always()
        run: rm -f "$RUNNER_TEMP/notify_key"

      # From outside, through nginx: a body that is not the form answers 400 without using a rate limit, and the
      # x-vhrd-release header names the release that answers. It must be the new one, and still be after the
      # activator has watched it (5 s, then 60 s more: a release that dies in that time is rolled back). Then one
      # bad address, which goes through the form's own checks, must answer 400 too. When nothing was shipped, the
      # release that must answer is the live one the build found, and there is nothing to watch.
      - name: The notify release answers
        env:
          SHIP: ${{ needs.build-notify.outputs.ship }}
          GIT: ${{ needs.build-notify.outputs.git }}
          URL: https://vhrd.tech/api/notify
        run: |
          [[ "$SHIP" =~ ^(true|false)$ && "$GIT" =~ ^[0-9a-f]{7,12}$ ]] || { echo "::error::no release to expect"; exit 1; }
          post() {
            curl -s -o /dev/null --max-time 10 -w '%{http_code} %header{x-vhrd-release}' -X POST \
              -H 'Accept: application/json' -H 'Content-Type: application/x-www-form-urlencoded' --data "$1" "$URL" || true
          }
          up=""
          for _ in $(seq 36); do
            got="$(post probe=1)"
            if [ "$got" = "400 $GIT" ]; then up=1; break; fi
            sleep 5
          done
          [ -n "$up" ] || { echo "::error::$URL answers '$got', not 400 from $GIT: the server refused or rolled back the release (journalctl _SYSTEMD_USER_UNIT=vhrd-notify-activate.service as vhrd-notify)"; exit 1; }
          if [ "$SHIP" = true ]; then
            sleep 80
            got="$(post probe=1)"
            [ "$got" = "400 $GIT" ] || { echo "::error::$GIT answered, then not ('$got'): it did not stay up, and the activator went back to the previous release or found none (its journal on the server)"; exit 1; }
          fi
          got="$(post 'email=not-an-address&list=donguru&consent=none&from=home&leave_empty=')"
          [ "$got" = "400 $GIT" ] || { echo "::error::a bad address got '$got', not 400 from $GIT"; exit 1; }
          echo "vhrd_notify $GIT is live: $URL answers 400 to a bad address"

      # rsync over SSH to the ci-site user, whose key the server forces into `rrsync -wo -munge` on the site folder.
      # The new files land beside the old ones and are renamed into place at the end (--delay-updates); pages that
      # went away are deleted after that (--delete-after). The host key is the one committed in .github/deploy.
      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          rsync --recursive --checksum --perms --chmod=D755,F644 --omit-dir-times \
            --delete-after --delay-updates --stats \
            -e "ssh -p $DEPLOY_PORT -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/deploy/known_hosts \
                -o ConnectTimeout=30" \
            "$RUNNER_TEMP/site/" "$DEPLOY_USER@$DEPLOY_HOST:/"

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"

      - name: Check the live site
        env:
          STAMP: ${{ needs.build.outputs.stamp }}
        run: python3 tools/check_live.py site https://vhrd.tech --built "$RUNNER_TEMP/site" --stamp "$STAMP"
