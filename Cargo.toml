# The notify service behind the site's "Get notified" forms (README "Notify service"): a library with the
# validator, the store and the HTTP handler, and a thin binary that serves it and manages the signups.
[workspace]
members = ["server/vhrd_notify", "server/vhrd_notify_cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Every dependency without its default features: only what is used, no bundled C, no TLS (nginx terminates it).
[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "macros", "sync", "signal"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "parse", "serde"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
vhrd_notify = { path = "server/vhrd_notify" }

[profile.dev]
# debug info in .dwo files next to the objects, not packed into every test binary
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

[profile.release]
strip = true

# just deploy-notify (tpm ship): release plus incremental compilation
[profile.deploy]
inherits = "release"
incremental = true
