# The notify service behind the site's "Get notified" forms (AGENTS.md "Notify service"): a library with the
# validator, the store and the HTTP handler, a thin binary that serves it and manages the signups, and the activator
# that takes a release the Deploy workflow uploaded (kept apart from the service, so an upload never checks itself).
[workspace]
members = ["server/vhrd_notify", "server/vhrd_notify_cli", "server/vhrd_notify_activate"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Every dependency without its default features: only what is used, no bundled C. TLS only for the mail out (nginx
# terminates the site's).
[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", default-features = false }
hmac = { version = "0.13.0", default-features = false }
# SMTP to mail.vhrd.tech: rustls with graviola as its crypto (Rust and assembly, no C), the system's roots
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-no-provider", "builder", "rustls-native-certs"] }
rustls-graviola = { version = "0.4.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "macros", "sync", "signal", "time"] }
toml = { version = "1.2.0", default-features = false, features = ["std", "parse", "serde"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
libtest-mimic = { version = "0.8.2", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
vhrd_notify = { path = "server/vhrd_notify" }

[profile.dev]
# debug info in .dwo files next to the objects, not packed into every test binary
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

[profile.release]
strip = true

# just deploy-notify (tpm ship): release plus incremental compilation
[profile.deploy]
inherits = "release"
incremental = true
