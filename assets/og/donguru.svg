<?xml version="1.0" encoding="UTF-8"?>
<!-- Donguru · one cable from your PC to your board share image. Edit freely in Inkscape or by hand: save as plain SVG, then `just og` renders it.
     Classes (.bg .ink .red .headline-shadow) are coloured by assets/og/light.css (the JPEG look, also
     this file's own default below) and assets/og/dark.css (the transparent X look); see AGENTS.md, "Link
     previews". Don't add fill="..." on those elements directly: it would fight the stylesheet. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="627" viewBox="0 0 1200 627">
  <title>Donguru · one cable from your PC to your board</title>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1a1a1a; }
    .red { fill: #c8141c; }
    .headline-shadow { filter: none; }
    text { font-family: "Audiowide"; font-size: 57px; }
  </style>
  <defs>
    <filter id="headline-shadow" x="-10%" y="-40%" width="120%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#08080a" flood-opacity="0.65" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="627"/>

  <!-- corner marks: four flush Ls, 28px legs, 5px thick, inset 32px from the card's own edges -->
  <g id="corners" class="red">
    <rect x="32" y="32" width="28" height="5"/>
    <rect x="32" y="32" width="5" height="28"/>
    <rect x="1140" y="32" width="28" height="5"/>
    <rect x="1163" y="32" width="5" height="28"/>
    <rect x="32" y="590" width="28" height="5"/>
    <rect x="32" y="567" width="5" height="28"/>
    <rect x="1140" y="590" width="28" height="5"/>
    <rect x="1163" y="567" width="5" height="28"/>
  </g>

  <!-- headline: Audiowide, flush left with the corners above, the product name (if any) in red -->
  <g id="headline" class="headline-shadow">
    <text x="32" y="100"><tspan class="red">Donguru</tspan><tspan class="ink"> · one cable from your PC</tspan></text>
    <text x="32" y="170"><tspan class="ink">to your board</tspan></text>
  </g>

  <!-- the halo, then the board picture, by relative href to its render (never shipped itself) -->
  <ellipse id="board-halo" cx="599.5" cy="399" rx="249.5" ry="200" fill="#ffffff" opacity="0.063"
           filter="url(#halo-blur)"/>
  <image id="board" x="349.3" y="198.9" width="481.6" height="400.8"
         preserveAspectRatio="xMidYMid meet" xlink:href="../../static/img/boards/b153-donguru/b153_hero.png"/>

  <!-- wordmark: the outline paths from static/img/wordmark.svg (never the Audiowide font itself), scaled to
       a 33px cap height, flush right with the corners above -->
  <g id="wordmark" transform="translate(859.07,532) scale(0.023013)">
