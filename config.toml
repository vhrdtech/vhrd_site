# vhrd.tech, built with Zola (version pinned in AGENTS.md). The preview build overrides base_url on the command line.
base_url = "https://vhrd.tech"
title = "VHRD"
description = "Instruments for embedded development: debug and I/O tools, the software that drives them, and the open-source Rust libraries underneath."
default_language = "en"

compile_sass = false
minify_html = false
build_search_index = false
# No blog and no feed: the old WordPress site is gone, and its paths redirect (deploy/redirects.map).
generate_feeds = false
# The 2400 px PNG render sources stay in the repo for re-encoding but never ship: the site uses their AVIF/WebP variants.
# The manifests are read by the templates (load_data) and name paths in the private hw repo: they never ship either,
# nor do the .gitkeep placeholders.
ignored_static = ["img/boards/**/*.png", "img/**/manifest.toml", "**/.gitkeep"]
feed_filenames = ["atom.xml"]

[markdown]
external_links_target_blank = false
smart_punctuation = true

# Inline colours through light-dark(), which follows the theme toggle (site.css sets color-scheme per theme).
[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
company = "VHRD"
# The legal name (Brreg), for the copyright line only; copy says VHRD (~/git/tpm/area/marketing/brand.md).
legal = "VHRD.TECH AS"
# The intro's vector pass (AGENTS.md "Intro"): the beam traces the first screen before the fade. On by default:
# it costs the first paint about 0.1 s on a slow phone, which is fine.
intro_trace = true
address = "Asker, Norway"
# Mail addresses are vh.mail components (to = contact, projects, donguru), never written into the HTML.
github = "https://github.com/vhrdtech"
# Header links: name, path. The red button is extra.notify.
nav = [
  { name = "Products", path = "/#products" },
  { name = "Software", path = "/software/" },
  { name = "Open source", path = "/open-source/" },
  { name = "Work", path = "/work/" },
  { name = "Lab", path = "/lab/" },
  { name = "Services", path = "/services/" },
]
notify = { name = "Get notified", path = "/donguru/#notify" }
# The version of the signup form's consent line (vh.notify); the notify service accepts only the versions in its
# settings (deploy/notify.toml consent_versions), so a new text gets a new version there first.
notify_consent = "2026-11-06"
# The link-preview images: the Donguru hero render, framed with the brand's red corner marks and wordmark,
# 1200x627 (tools/og_images.py, `just og`). /pinsmith, /can, /software and /work show their own board instead
# (extra.og_image, extra.twitter_image, extra.og_image_alt, in the page's front matter). og:image is a JPEG
# flattened onto white, since LinkedIn and Facebook fill a transparent PNG with a dull grey card instead of
# white (Roman, round 4); twitter:image keeps the transparent PNG, since X reads it first and shows it on its
# own dark or light theme.
og_image = "img/og/default-3.jpg"
twitter_image = "img/og/default-2.png"
og_image_alt = "Donguru (B153), a USB-C dongle PCB, framed by red corner marks and the VHRD.TECH wordmark"
