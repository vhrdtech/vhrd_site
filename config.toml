# vhrd.tech, built with Zola (version pinned in AGENTS.md). The preview build overrides base_url on the command line.
base_url = "https://vhrd.tech"
title = "VHRD"
description = "Instruments for embedded development, and the open-source software behind them."
default_language = "en"

compile_sass = false
minify_html = false
build_search_index = false
# No blog or shop here yet: the old WordPress site serves its posts, /feed/ and /shop/ behind this one.
generate_feeds = false
# The 2400 px PNG render sources stay in the repo for re-encoding but never ship: the site uses their AVIF/WebP variants.
ignored_static = ["img/boards/**/*.png"]
feed_filenames = ["atom.xml"]

[markdown]
external_links_target_blank = false
smart_punctuation = true

# Inline colours through light-dark(), which follows the theme toggle (site.css sets color-scheme per theme).
[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
company = "VHRD"
# The legal name (Brreg), for the copyright line only; copy says VHRD (~/git/tpm/area/marketing/brand.md).
legal = "VHRD.TECH AS"
# The intro's vector pass (README "Intro"): the beam traces the first screen before the fade. On (Roman, 4 Nov 2026):
# it costs the first paint about 0.1 s on a slow phone, which is fine.
intro_trace = true
address = "Asker, Norway"
email = "hello@vhrd.tech"
github = "https://github.com/vhrdtech"
# Header links: name, path. The red button is extra.notify.
nav = [
  { name = "Products", path = "/#products" },
  { name = "Software", path = "/software/" },
  { name = "Open source", path = "/open-source/" },
  { name = "Work", path = "/work/" },
  { name = "Lab", path = "/lab/" },
  { name = "Services", path = "/services/" },
  # The shop is the old WordPress site's: on vhrd.tech every path this site does not have falls through to it.
  { name = "Shop", path = "/shop/" },
]
notify = { name = "Get notified", path = "/donguru/#notify" }
