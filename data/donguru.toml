  ["Plug VBUS", "off"],
  ["Header VBUS_SW", "off"],
  ["Relay", "open"],
  ["Device USB data", "connected to the hub"],
  ["SBU", "to the MCU side, level translator off, pull-ups off, low level selected"],
  ["J101 IO, plug A2/B2", "MCU pins as inputs; with Donguru unpowered a pin driven high reaches its 3.3 V rail through the MCU's clamp diodes and series resistors"],
]

