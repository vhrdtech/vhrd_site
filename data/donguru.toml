# Donguru (B153): the tables of /donguru, copied from the datasheet, Preview 0.2 of 24 Oct 2026
# (~/git/hw/b153_typec_serial/spec/datasheet/b153_datasheet.typ). The values, units and notes stay exactly as there:
# Marketing's rule is that the specs on the page equal the datasheet. When the datasheet changes, change this file.
# Markup in the strings: [tbd] becomes the tbd badge, [Plus] the Plus badge; <sub> and <code> pass through.
# A spec row is [parameter, min, typ, max, unit, notes].

datasheet = "Preview 0.2, 24 Oct 2026"

variants = [
  ["USB 2.0 hub", "2 ports", "4 ports"],
  ["USB to the device (D+/D−), switchable", "✓", "✓"],
  ["USB on the 2.54 mm header", "—", "✓"],
  ["USB to the device over SBU, switchable with SBU I/O", "—", "✓"],
  ["VBUS switch, meter, PD on both ports, SBU and header IO, relay, SWD probe", "✓", "✓"],
]

