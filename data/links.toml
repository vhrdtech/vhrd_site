# Our projects and where a mention of one leads: the `vh.ref` component links a name from this table
# ({{ <vh.ref name="WireWeaver" /> }}), and the browser check (tools/mentions.py) holds every page to it: the first
# time a name appears in a page's prose, it is a link to this address. Link the first mention in each section.
#
# - `name`: the name as the text writes it, case and all.
# - `url`: a path on this site (passed through get_url, so a preview under a sub-path works) or a full URL.
#   A page of our own when there is one; else its card on /open-source; else its repository.
# - `repo`: its repository, as data/stack.toml has it; a link there counts as linked too (the crate cards' titles).

