# Wire format and APIs

[[repo]]
name = "wire_weaver_template"
owner = "vhrdtech"
area = "templates"
lang = "Rust"
desc = "A starting point for a WireWeaver device on USB. One API crate is shared by the firmware and the host. Example firmware runs on Nucleo H743ZI2 and H753ZI boards and an STM32G0 board, and any board with embassy-usb should work. A Rust driver comes with a simple client example and a REPL with history and auto-complete. A rename script and a virtual device are still to do."

[[repo]]
name = "can_bus_ww"
owner = "vhrdtech"
area = "wire"
lang = "Rust"
desc = "The WireWeaver definition of a CAN bus bridge's API and data types, for a CAN FD to USB adapter. It describes classic and FD frames with standard or extended ids, bit timing, acceptance filters, bus modes, SD card logging settings and bus error notifications. The API has properties that switch CAN and termination on, a stream of received frames and a method to send one. The repo has no README yet."

[[repo]]
name = "ww_lsp"
owner = "romixlab"
area = "wire"
lang = "Rust"
desc = "A language server for WireWeaver APIs that runs beside rust-analyzer. It shows the ExactUnits types of API items as inlay hints, such as `mV · i16 · ±32.767 V`, and on hover the unit, exact scale, step, range and size on the wire. Setups for Neovim, Helix, Kakoune, Emacs, VS Code, JetBrains IDEs and Zed come with it. It is a prototype."

[[repo]]
name = "napier"
owner = "romixlab"
area = "science"
lang = "Rust"
crate = "si_dynamic"
desc = "A Rust parser for SI quantities and units in text, at run time. It reads every SI base and derived unit and prefix, exponents, unit expressions such as m/s² or W/(m·K), percent and ppm. It also reads the resistance shorthand of schematics and BOMs, such as 4k7 and 499kR. Each unit carries its dimension and scale, and units beyond SI, such as rpm, are registered at run time."
source = "README"
fence = "rust"
wide = 60
code = '''
use si_dynamic::{
    BaseUnit, OhmF32, Prefix, Quantity,
    Unit
};

let q = Quantity::parse("4.7 uF")?;
assert_eq!(
    q.unit.as_unit(),
    Some(&Unit::new(
        Prefix::Micro, BaseUnit::Farad, 1
    ))
);
assert_eq!(q.base_decimal()?, "0.0000047");

let q = Quantity::parse("10 V/us")?;
    // a unit expression
assert_eq!(q.unit.to_string(), "V/μs");

let r = OhmF32::parse("4k7")?; // 4700 Ω
assert_eq!(r.0, 4700.0);
'''
code_wide = '''
