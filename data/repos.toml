[[repo]]
name = "rvariant"
owner = "romixlab"
area = "host"
lang = "Rust"
crate = "rvariant"
desc = "A dynamically typed value for Rust, inspired by Qt's QVariant: a Variant plus a type descriptor with an SI unit, enum variants or a currency. Text is parsed strictly and printed so it reads back: 4k7 with an ohm type is 4700 Ω. Conversions never lose information silently, and a vendor-text parser reads distributor and BOM values like 13.7 kOhms. Used for table cells, CSV import and stored parameters."
source = "README"
fence = "rust"
wide = 80
code = '''
use rvariant::{
    Variant, VariantTy, NumberTy,
    si_dynamic::{Unit, BaseUnit}
};

let ohm = VariantTy::si(NumberTy::F32,
    Unit::base(BaseUnit::Ohm));
let r = Variant::try_from_str("4k7", &ohm)?;
// 4700 Ω
assert_eq!(r.to_string(), "4700 Ω");
// Display is parseable back
assert_eq!(Variant::try_from_str("-1",
    &VariantTy::u32()).is_err(), true);
let n: u16 =
    Variant::str("0x10").try_into()?;
// 16
'''
