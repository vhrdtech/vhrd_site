owner = "vhrdtech"
area = "firmware"
lang = "Rust"
desc = "A USB Mass Storage device class for embassy-usb, which today has only the host side of MSC. It is planned to do Bulk-Only Transport with SCSI commands, several LUNs on one interface, an async `Lun` trait, media change and write protect. It is built for logring's two-LUN USB view. So far the repo is a scaffold: the class itself is not written yet."

[[repo]]
name = "motor_sim"
owner = "vhrdtech"
area = "science"
lang = "Rust"
docs = "https://ww.vhrd.tech/examples/motor_demo/"
desc = "A deterministic no_std electric motor simulator in pure Rust, for testing motor controllers in software. It models a PMSM in dq with an average inverter, rotor mechanics and loads. The true state is kept apart from what a controller measures, with sensor offsets, noise and faults. The same parameters and seed give the same run on every target, and libm is the only dependency."
source = "README"
fence = "rust"
wide = 80
code = '''
use motor_sim::{
    Drive, Load, Motor, presets
};

let mut motor = Motor::new(
    presets::vesc_hobby_outrunner(),
    42
);
motor.set_load(Load::Fan {
    k_nms2_per_rad2: 2e-7
});
let dt = 1.0 / 25_000.0;
for _ in 0..25_000 {
    let _s = motor.sensors();
    // i_abc_a, vdc_v, encoder_count, hall
    let drive = Drive::Duty([0.5; 3]);
    // your controller here
    motor.step(&drive, dt);
}
'''
code_wide = '''
