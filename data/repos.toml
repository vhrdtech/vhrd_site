# The other repositories on /open-source, after the stack (data/stack.toml), grouped by area in the order below.
# Facts come from each repo's README (or its files where there is none). Every repo gets a card like the stack's.
#
# - `desc`: 2-4 sentences, Markdown inline (backticks).
# - `lang`; `crate` (on crates.io: crates.io and docs.rs links) and `docs` where there are some.
# - `logo_dark`, `logo_light`, `logo_w`, `logo_h`: the repo's own logo or icon, under static/, as in data/stack.toml.
# - `code`, `code_wide`, `wide`, `fence`: a short sample (tools/samples.py), with `source`: README or examples/NAME,
#   the place it is taken from as it is (only line breaks differ). samples.py checks it against a local checkout;
#   nothing is compiled. A public repo without an obvious sample shows "example: TBD".
# - `wip = true`: work in progress, the card says so (or its `badge`, e.g. "early stage"); `note`: shown where the crates.io version would be.
# - `stack = true`: a highlight (data/stack.toml, `front = true`) shown in this area too; its card comes from
#   data/stack.toml, and `crate` here (the same as there) only places it in the area's order.
# - `private = true`: not public yet. The card says "coming in the future" and has no link, code or logo.
# - Left off for now, until Roman confirms (4 Nov 2026): romixlab/dot (personal dotfiles), vhrdtech/mx3 (internal
#   server), romixlab/shrink_wrap (an old private copy; shrink_wrap lives in wire_weaver), vhrdtech/io_weaver and
#   romixlab/rockface (paid products, on /software), vhrdtech/usb_io_fw (closed source, its README says so), and
#   vhrdtech/can_bus and romixlab/power_meter (private, no README or description to write a pitch from yet).



