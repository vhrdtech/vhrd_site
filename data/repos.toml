[[repo]]
name = "m2k"
owner = "romixlab"
area = "host"
lang = "Rust"
desc = "The Analog Devices ADALM2000 (M2K) from Rust, the shell or Python: scope, signal generator, power supplies, voltmeter, logic analyzer and calibration. It talks to the device over the network with its own pure-Rust iiod client, without libiio, libm2k or C. Every command can answer in JSON, and the iiod client also works for other IIO devices. It is not on crates.io yet."
source = "README"
fence = "sh"
wide = 80
code = '''
m2k info
    # model, serial, firmware, calibration,
    # outputs, supplies
m2k cal run
    # self-calibration, ~1.5 s; kept until
    # power-off
m2k scope -n 10k -r 1M --csv cap.csv
    # both channels: stats per channel,
    # all samples as CSV
m2k gen -c 1 --for 10s sine -f 1k -a 1
    # W1: 1 kHz, ±1 V; off again after
    # 10 s (or Ctrl+C)
m2k voltmeter --range 2.5
    # DC and AC rms on 1+/1- and 2+/2-
m2k psu set --pos 3.3 --neg -3.3;
m2k psu off
m2k logic -n 100k -r 10M -p 0-7
'''
