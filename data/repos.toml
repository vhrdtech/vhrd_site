assert_eq!(r.0, 4700.0);
'''

[[repo]]
name = "bitfield_introspect"
owner = "romixlab"
area = "wire"
lang = "Rust"
desc = "A Rust attribute macro for structs made with bitfield-struct. A field takes #[value(0 = \"off\")] attributes that say what each raw value means, and the macro turns them into doc lines such as \"0 = off\" on that field. It is an early 0.1.0 crate without a README."

# Firmware and embedded

[[repo]]
name = "typec_dongle"
owner = "vhrdtech"
area = "firmware"
lang = "Rust"
docs = "https://vhrdtech.github.io/typec_dongle/"
desc = "Donguru is a USB-C dongle that turns one USB-C port into a small test bench: a USB hub, UART, I2C, GPIO and ADC, a power switch and a power meter. The `donguru` (`dg`) command line drives all of it, with JSON output and fixed exit codes for scripts and CI. A Python package does the same through the same Rust library. Rev B boards for testers are planned for the end of 2026."

[[repo]]
name = "logring"
owner = "vhrdtech"
area = "firmware"
lang = "Rust"
desc = "A power-cut-safe log store for embedded Rust, no_std and without alloc. Many tracks of any ShrinkWrap type are written into a ring file on an SD card, with sessions, recordings and markers. A PC tool and a Python module read a card image and export CSV, MCAP and MF4. It is tested on card images so far, not yet on a real card, and showing the log as a USB disk is planned."
source = "README"
fence = "python"
code = '''
import logring

card = logring.open("card.img")
df = card.track("can1_rx").to_pandas()
'''

[[repo]]
name = "exfat_lite"
owner = "vhrdtech"
area = "firmware"
lang = "Rust"
desc = "A minimal exFAT for microcontroller SD cards, no_std and without allocation. It formats a card with SD Association geometry, mounts and checks a volume, finds and reads files, and creates preallocated contiguous files that their owner writes by raw sector address. A crafted card gives an error, never a panic or a hang. Checked with fsck.exfat and a Linux mount; Windows and macOS checks are pending."
source = "README"
fence = "rust"
wide = 70
code = '''
let mut vol = Volume::mount(dev).await?;
    // validates boot sector, checksum,
    // bitmap, up-case
vol.create(&NewFile::new("README.txt")
    .with_data(b"hello\n")).await?;
let ring = NewFile::new("logring.wlr")
    .size(32 << 20)
        // preallocated, contiguous,
        // FAT untouched
    .align_sectors(
        geometry.boundary_unit_sectors)
        // starts on an allocation unit
        // boundary
    .attributes(attr::READ_ONLY
        | attr::SYSTEM | attr::HIDDEN);
let ring = vol.create(&ring).await?;
let lba = vol.info()
    .cluster_lba(ring.first_cluster);
    // write it by raw sector address
    // from here
'''
code_wide = '''
