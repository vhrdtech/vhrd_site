# Drivers and HALs

[[repo]]
name = "slg4682x"
owner = "romixlab"
area = "drivers"
lang = "Rust"
crate = "slg4682x"
desc = "A Rust HAL for the SLG46824 and SLG46826 mixed-signal matrix chips. It reads and programs their RAM and NVM over I2C, and rewires the matrix while it runs. Any `embedded-hal` I2C implementation works, and the crate is `no_std` without its default features."

[[repo]]
name = "bq769x2"
owner = "romixlab"
area = "drivers"
lang = "Rust"
desc = "Register definitions in no_std Rust for the TI BQ76952, BQ76942 and BQ769142 battery monitor AFEs. It covers the direct command and subcommand registers as bitfield structs, with optional defmt. So far it is register definitions only, without a README or a driver on top."

[[repo]]
name = "usb4604"
owner = "romixlab"
area = "drivers"
lang = "Rust"
crate = "usb4604"
desc = "A Rust HAL for the GPIO pins and the I2C master of Microchip's USB4604 USB hub. It reaches them through the hub's feature controller with USB control transfers (nusb), and its I2C bridge implements the embedded-hal 1.0 I2c trait. Eight PIO pins are verified to work; SPI and UART are not supported."

[[repo]]
name = "otm8009a"
owner = "romixlab"
area = "drivers"
lang = "Rust"
crate = "otm8009a"
desc = "A bare-metal `no_std` Rust driver for the OTM8009A LCD controller. It sends the controller's init sequence through a MIPI DSI host, using the `embedded-display-controller` traits. Frame rate, portrait or landscape, RGB or BGR order and the size are settings."

[[repo]]
name = "i2c_periph"
owner = "romixlab"
area = "drivers"
private = true
lang = "Rust"
desc = "A portable async no_std I2C driver for microcontrollers, with one API across I2C IPs. It adds what a test adapter needs and HAL drivers often lack: repeated starts per operation, NACK reports with the byte, a clock-stretch watchdog, bus recovery through GPIO and the actual SCL frequency. The DesignWare I2C of the RP2350 is the only backend so far; STM32 is an idea."

[[repo]]
name = "pd_bench"
owner = "romixlab"
area = "drivers"
private = true
lang = "Rust"
desc = "A no_std driver for the onsemi FUSB302 USB PD PHY over embedded-hal-async, with batched I2C transactions and a register-level simulator for host tests. Next to it are a USB PD sink library on usbpd's policy engine, with policies for testing PD sources, and a PD message log that both ends of a link write the same way. The driver has had one hardware run; the rest is host-tested only."

# Host tools and instruments

[[repo]]
name = "io_bridge"
owner = "vhrdtech"
area = "host"
lang = "Rust"
desc = "A client library meant to read and drive GPIO, I2C, USART, SPI and ADC on a device over USB, Ethernet or CAN, built on WireWeaver. It is an early start: the API has one method that switches an LED, the client connects over USB, and the Python module is a stub."

[[repo]]
name = "picoboot_host"
owner = "vhrdtech"
area = "host"
lang = "Rust"
desc = "A Rust library for the RP2350 and RP2040 boot ROM in BOOTSEL mode, on nusb without libusb. It erases, writes and verifies flash from UF2, ELF or raw images and reboots the chip, so a host can update a device without a button press or picotool. A simulated boot ROM tests the whole sequence without hardware. OTP and the RP2040 EXEC commands are not implemented yet."
source = "README"
fence = "rust"
wide = 80
code = '''
use picoboot_host::{Image, Picoboot, usb};

let image = Image::from_uf2(
    &std::fs::read("app.uf2").unwrap(),
    &[picoboot_host::image::family
        ::RP2350_ARM_S]
)?;
let mut pb = usb::open(None).await?;
// the only BOOTSEL device connected
pb.flash(&image, &mut |stage, done, total| {
    eprintln!("{stage:?}: {done}/{total}");
})
.await?;
pb.reboot2(
    picoboot_host::proto::Reboot2::Normal,
    picoboot_host::proto::REBOOT_DELAY
)
.await?;
'''
