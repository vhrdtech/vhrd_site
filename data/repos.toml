    .size(32 << 20) // preallocated, contiguous, FAT untouched
    .align_sectors(geometry.boundary_unit_sectors)
        // starts on an allocation unit boundary
    .attributes(attr::READ_ONLY | attr::SYSTEM | attr::HIDDEN);
let ring = vol.create(&ring).await?;
let lba = vol.info().cluster_lba(ring.first_cluster);
    // write it by raw sector address from here
'''

[[repo]]
