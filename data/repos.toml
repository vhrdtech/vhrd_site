[[repo]]
name = "saleae_rs"
owner = "romixlab"
area = "host"
lang = "Rust"
desc = "Drives Saleae logic analyzers through Saleae's headless Logic 2 automation server, without the Logic 2 GUI. It is a Rust library, the `saleae` command line and a Python module for notebooks and test benches. One command captures, runs an I2C, SPI or UART analyzer and prints a short summary. Saleae's simulated devices work without hardware."
source = "README"
fence = "python"
wide = 80
code = '''
import saleae_rs as saleae

s = saleae.Session(sim_only=True)
    # starts the server in the background
    # on first use
sim = next(d for d in s.devices()
           if d["simulated"])
    # F4241 / F4244 / F4243 without real
    # hardware
rec = s.capture(device=sim["id"],
                digital=[0, 1],
                duration=0.5)
analyzer = s.add_analyzer(
    rec["capture"], "I2C",
    settings={"SDA": 0, "SCL": 1})
print(s.summarize(rec["capture"],
                  analyzer,
                  kind="i2c")["text"])
s.close(rec["capture"])
'''
code_wide = '''
