# The other repositories on /open-source, after the stack (data/stack.toml), grouped by area in the order below.
# Facts come from each repo's README (or its files where there is none); the pitch is one plain sentence.
#
# - `private = true`: not public yet. The card says "coming in the future" and has no link.
# - Left off for now, until Roman confirms (4 Nov 2026): romixlab/dot (personal dotfiles), vhrdtech/mx3 (internal
#   server), romixlab/shrink_wrap (an old private copy; shrink_wrap lives in wire_weaver), vhrdtech/io_weaver and
#   romixlab/rockface (paid products, on /software), vhrdtech/usb_io_fw (closed source, its README says so), and
#   vhrdtech/can_bus and romixlab/power_meter (private, no README or description to write a pitch from yet).

[[area]]
id = "wire"
title = "Wire format and APIs"
sig = "usb"

[[area]]
id = "firmware"
title = "Firmware and embedded"
sig = "can"

[[area]]
id = "drivers"
title = "Drivers and HALs"
sig = "bus"

[[area]]
id = "host"
title = "Host tools and instruments"
sig = "analog"

[[area]]
id = "eda"
title = "EDA and hardware tools"
sig = "power"

# Wire format and APIs

[[repo]]
name = "wire_weaver_template"
owner = "vhrdtech"
area = "wire"
lang = "Rust"
pitch = "WireWeaver over USB as a template: a shared API, example firmware and a Rust host driver with a REPL."

[[repo]]
name = "can_bus_ww"
owner = "vhrdtech"
area = "wire"
lang = "Rust"
pitch = "WireWeaver API and data structures for CAN bus bridges."

[[repo]]
name = "ww_lsp"
owner = "romixlab"
area = "wire"
lang = "Rust"
pitch = "Language server for WireWeaver APIs: units as inlay hints, beside rust-analyzer. A prototype."

[[repo]]
name = "napier"
owner = "romixlab"
area = "wire"
lang = "Rust"
pitch = "Parses SI values and units from text at run time, schematic shorthand like 4k7 included."

[[repo]]
name = "bitfield_introspect"
owner = "romixlab"
area = "wire"
lang = "Rust"
pitch = "Value descriptions on bitfield-struct fields, turned into structured data for decoding."

