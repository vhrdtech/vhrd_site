[[crate]]
name = "canzone"
fits = true
layer = "Firmware"
sig = "can"
wip = true
pitch = "Stand-alone Rust driver for the Bosch M_CAN controller, aimed at STM32 G0, G4, H5, H7 and L5. Goals: no panics, no blocking waits without a timeout, optional async."
repo = "https://github.com/romixlab/canzone"
note = "renamed from mcan, not on crates.io yet"
lang = "rust"
code = '''
let mut can =
    unwrap!(can.into_config_mode());
can.set_nominal_bit_timing(unwrap!(
    NominalBitTiming::new(1, 55, 8, 1)
));
unwrap!(can.set_layout(layout_fdcan1));
can.set_automatic_bus_off_recovery(true);
let mut can = unwrap!(can.into_normal());

let id = unwrap!(StandardId::new(0x123));
can.write_tx_buffer_pend(
    tx_buffers.idx1,
    TxFrameHeader::fd_brs(Id::Standard(id)),
    &[0xAA, 0xBB, 0xCC],
);
'''
