[[crate]]
name = "embedded_bedrock"
# fits = true: the code is written to 35 columns, so it never scrolls sideways (the browser check holds it)
fits = true
layer = "Firmware"
sig = "can"
front = true
pitch = "A bare-metal firmware template with ruggedizing, debugging and logging built in, and optional embassy, RTIC and HAL support. The template is an agent skill that generates a firmware for a chip, with its errata notes, blink codes on the status LED when it cannot start, and a clock a host keeps in step across boards. Most STM32s and a few MCUs from other vendors are covered."
repo = "https://github.com/romixlab/embedded_bedrock"
note = "not on crates.io yet"
lang = "rust"
code = '''
use bedrock_led::code::*;
use bedrock_sync::{Config, Sync};
use cortex_m::asm::delay;

// A firmware that will not start
// says why on its status LED, then
// waits in the ROM bootloader.
if !guard.runs_board() {
    let pause = |n| delay(n * KHZ);
    blink(Code::UnknownRework,
          led, pause);
    reboot_into_rom_bootloader();
}

// One clock on all boards, steered
// by the host over WireWeaver:
// Acquiring, Locked within 2 ms.
// `ww sync` locks the boards in
// 1.2-1.6 s. On Donguru it costs
// about 1.5 KB of flash.
static SYNC: Sync =
    Sync::new(Config::DEFAULT);

// clock.steer, once a second
let r = SYNC.with(|clock, now| {
    server.steer(clock, now, &p)
});

// all boards act at the same µs
SYNC.wait_until_shared(t).await?;
'''
wide = 70
code_wide = '''
use bedrock_led::code::*;
use bedrock_sync::{Config, Sync};
use cortex_m::asm::delay;

// A firmware that will not start says why on its status LED, then
// waits in the ROM bootloader.
if !guard.runs_board() {
    let pause = |n| delay(n * KHZ);
    blink(Code::UnknownRework, led, pause);
    reboot_into_rom_bootloader();
}

// One clock on all boards, steered by the host over WireWeaver:
// Acquiring, Locked within 2 ms. `ww sync` locks the boards in
// 1.2-1.6 s. On Donguru it costs about 1.5 KB of flash.
static SYNC: Sync = Sync::new(Config::DEFAULT);

// clock.steer, once a second
let r = SYNC.with(|clock, now| { server.steer(clock, now, &p) });

// all boards act at the same µs
SYNC.wait_until_shared(t).await?;
'''

[[crate]]
name = "cnt"
crate = "cnt"
layer = "Firmware"
sig = "can"
front = true
fits = true
pitch = "When logging is not an option, count. Each count statement gets its own counter in a RAM array, through a linker trick like defmt's, without a critical section, so it is safe in any interrupt; on Cortex-M3 and up a counter shared with an interrupt never loses an update. The cnt tool reads the counters over the debug probe, once, as a watch or in a TUI, with the defmt log beside them."
repo = "https://github.com/romixlab/cnt"
lang = "rust"
code = '''
// one RAM counter per call site,
// no critical section, safe in an IRQ
fn high_frequency_irq() {
    let r = do_something();
    cnt::cnt_if!(r.is_err(),
                 unpack_errors: u64);
}

fn process_packet() {
    cnt::cnt!(packet_count: u32);
}

// on the PC, over the debug probe:
// $ cnt tui --chip STM32H533RE
'''
wide = 50
