code = '''
#[ww_trait]
#[claim(exclusive)]
pub trait Uart {
    #[counted]
    stream!(rx: RxChunk<'i>);

    #[credit]
    sink!(tx: MaxLen<RefVec<'i, u8>,
                     UART_TX_MAX>);

    fn capabilities() -> Capabilities<'i>;
}
'''

[[crate]]
name = "shrink_wrap"
fits = true
crate = "shrink_wrap"
layer = "Wire format"
sig = "usb"
front = true
logo_dark = "img/oss/shrink_wrap-dark.svg"
logo_light = "img/oss/shrink_wrap-light.svg"
logo_w = 96
logo_h = 96
pitch = "Compact zero-copy wire format for microcontrollers. No allocator, dynamic types, packed down to the bit."
repo = "https://github.com/vhrdtech/wire_weaver/tree/master/shrink_wrap"
lang = "rust"
code = '''
// 1 + 7 or 1 + 10 bits
#[derive_shrink_wrap(ww_repr = u1)]
enum I2cAddress { Seven(U7), Ten(U10) }

#[derive_shrink_wrap]
struct I2cWrite<'i> {
    // 0x50: 0 1010000
    addr: I2cAddress,
    stop: bool,            // 1 bit
    fast: bool,            // 1 bit
    retries: Nibble,       // 3: 0011
    // Some(500): 1 0111110100
    timeout_ms: Option<U10>,
    data: RefVec<'i, u8>,  // ab cd
}
// 50 83 be 80 ab cd 02: 7 bytes, the
// count (02) at the back. repr(C): 20.
'''

[[crate]]
name = "exact_units"
fits = true
layer = "Units"
sig = "bus"
front = true
logo_dark = "img/oss/exact_units-dark.svg"
logo_light = "img/oss/exact_units-light.svg"
logo_w = 157
logo_h = 96
pitch = "Units of measure checked at compile time, with exact scales. The same bytes as the plain integer, no_std and no alloc."
repo = "https://github.com/romixlab/exact_units"
docs = "https://exact.vhrd.tech/"
note = "not on crates.io yet"
lang = "rust"
code = '''
// exact or refused, never rounded
let t: Micros<u32> = Fixed::new(1500);
assert_eq!(t.to::<Milli, u16>(), None);
// 1500 µs is not a whole number of ms

// V/V and W/W are different kinds,
// and the kind picks the dB formula
type V = Per<Volt, Volt>;
type W = Per<Watt, Watt>;
Fixed::<V, One, f64>::new(2.0).to_db();
// 6.0206 dB: 20·lg 2
Fixed::<W, One, f64>::new(2.0).to_db();
// 3.0103 dB: 10·lg 2

// a threshold in dB: an integer, exact,
// 501 mV/V but 251 mW/W
let v: Fixed<V, Milli, u16> = db!(-6);
let p: Fixed<W, Milli, u16> = db!(-6);

// 0.5 duty is not -3 dB: a Ratio has no dB
// Fixed::<Ratio, One, f64>::new(0.5)
//     .to_db();
// error[E0080]: decibels are for W/W or
// V/V, A/A, Pa/Pa: a plain Ratio has no
// level form
'''

[[crate]]
name = "embedded_bedrock"
# fits = true: the code is written to 35 columns, so it never scrolls sideways (the browser check holds it)
fits = true
layer = "Firmware"
sig = "can"
front = true
pitch = "Bare-metal firmware template with ruggedizing, debugging and logging built in. Optional embassy, RTIC and HAL support."
repo = "https://github.com/romixlab/embedded_bedrock"
note = "not on crates.io yet"
lang = "rust"
code = '''
use bedrock_led::code::*;
use bedrock_sync::{Config, Sync};
use cortex_m::asm::delay;

// A firmware that will not start
// says why on its status LED, then
// waits in the ROM bootloader.
if !guard.runs_board() {
    let pause = |n| delay(n * KHZ);
    blink(Code::UnknownRework,
          led, pause);
    reboot_into_rom_bootloader();
}

// One clock on all boards, steered
// by the host over WireWeaver:
// Acquiring, Locked within 2 ms.
// `ww sync` locks the boards in
// 1.2-1.6 s. On Donguru it costs
// about 1.5 KB of flash.
static SYNC: Sync =
    Sync::new(Config::DEFAULT);

// clock.steer, once a second
let r = SYNC.with(|clock, now| {
    server.steer(clock, now, &p)
});

// all boards act at the same µs
SYNC.wait_until_shared(t).await?;
'''

[[crate]]
name = "cnt"
crate = "cnt"
layer = "Firmware"
sig = "can"
front = true
fits = true
pitch = "When logging is not an option, count: events and errors in a RAM array, safe in any interrupt, without a critical section. Read over the debug probe with `cnt read` or `cnt tui`."
repo = "https://github.com/romixlab/cnt"
lang = "rust"
code = '''
// one RAM counter per call site,
// no critical section, safe in an IRQ
fn high_frequency_irq() {
    let r = do_something();
    cnt::cnt_if!(r.is_err(),
                 unpack_errors: u64);
}

fn process_packet() {
    cnt::cnt!(packet_count: u32);
}

// on the PC, over the debug probe:
// $ cnt tui --chip STM32H533RE
'''

[[crate]]
name = "canzone"
fits = true
layer = "Firmware"
sig = "can"
wip = true
pitch = "Stand-alone Rust driver for the Bosch M_CAN controller, aimed at STM32 G0, G4, H5, H7 and L5. Goals: no panics, no blocking waits without a timeout, optional async."
repo = "https://github.com/romixlab/canzone"
note = "renamed from mcan, not on crates.io yet"
lang = "rust"
code = '''
let mut can =
    unwrap!(can.into_config_mode());
can.set_nominal_bit_timing(unwrap!(
    NominalBitTiming::new(1, 55, 8, 1)
));
unwrap!(can.set_layout(layout_fdcan1));
can.set_automatic_bus_off_recovery(true);
let mut can = unwrap!(can.into_normal());

let id = unwrap!(StandardId::new(0x123));
can.write_tx_buffer_pend(
    tx_buffers.idx1,
    TxFrameHeader::fd_brs(Id::Standard(id)),
    &[0xAA, 0xBB, 0xCC],
);
'''

