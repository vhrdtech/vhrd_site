[[crate]]
name = "exact_units"
title = "ExactUnits"
fits = true
layer = "Units"
sig = "bus"
front = true
logo_dark = "img/oss/exact_units-dark.svg"
logo_light = "img/oss/exact_units-light.svg"
logo_w = 157
logo_h = 96
pitch = "ExactUnits puts a number's unit, scale and storage into its type and checks them at compile time. A conversion is exact or refused, never rounded through a float, and the type is the same bytes as the plain integer, no_std and no alloc. It covers the cases other unit crates leave out: a temperature is a point against an origin, and a voltage gain is a different kind from a power gain."
repo = "https://github.com/romixlab/exact_units"
docs = "https://exact.vhrd.tech/"
note = "not on crates.io yet"
lang = "rust"
code = '''
// exact or refused, never rounded
let t: Micros<u32> = Fixed::new(1500);
assert_eq!(t.to::<Milli, u16>(), None);
// 1500 µs is not a whole number of ms

// V/V and W/W are different kinds,
// and the kind picks the dB formula
type V = Per<Volt, Volt>;
type W = Per<Watt, Watt>;
Fixed::<V, One, f64>::new(2.0).to_db();
// 6.0206 dB: 20·lg 2
Fixed::<W, One, f64>::new(2.0).to_db();
// 3.0103 dB: 10·lg 2

// a threshold in dB: an integer, exact,
// 501 mV/V but 251 mW/W
let v: Fixed<V, Milli, u16> = db!(-6);
let p: Fixed<W, Milli, u16> = db!(-6);

// 0.5 duty is not -3 dB: a Ratio has no dB
// Fixed::<Ratio, One, f64>::new(0.5)
//     .to_db();
// error[E0080]: decibels are for W/W or
// V/V, A/A, Pa/Pa: a plain Ratio has no
// level form
'''
wide = 80
