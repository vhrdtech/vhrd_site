[[crate]]
name = "shrink_wrap"
title = "ShrinkWrap"
fits = true
crate = "shrink_wrap"
layer = "Wire format"
sig = "usb"
front = true
logo_dark = "img/oss/shrink_wrap-dark.svg"
logo_light = "img/oss/shrink_wrap-light.svg"
logo_w = 96
logo_h = 96
pitch = "ShrinkWrap is the binary wire format under WireWeaver. It packs data to 1-bit, 4-bit and 1-byte alignment without compression, so useful messages fit into a CAN frame. Structs, enums with data, strings and vectors of any size work without an allocator, and reading is zero-copy. An older device and newer software read each other's data, and the other way round."
repo = "https://github.com/vhrdtech/wire_weaver/tree/master/shrink_wrap"
lang = "rust"
code = '''
// 1 + 7 or 1 + 10 bits
#[derive_shrink_wrap(ww_repr = u1)]
enum I2cAddress { Seven(U7), Ten(U10) }

#[derive_shrink_wrap]
struct I2cWrite<'i> {
    // 0x50: 0 1010000
    addr: I2cAddress,
    stop: bool,            // 1 bit
    fast: bool,            // 1 bit
    retries: Nibble,       // 3: 0011
    // Some(500): 1 0111110100
    timeout_ms: Option<U10>,
    data: RefVec<'i, u8>,  // ab cd
}
// 50 83 be 80 ab cd 02: 7 bytes, the
// count (02) at the back. repr(C): 20.
'''
wide = 80
