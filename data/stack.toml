# The highlights: the open-source crates on the front page's stack and in the Highlights group at the top of
# /open-source, in this order (`front = true`). Every other crate and repository is in data/repos.toml. Facts come from each crate's README; code samples are taken from the crate's
# README, book or examples, shortened only.
#
# - `crate`: the crates.io name. Both pages fetch its version and downloads at build time; leave it out while the
#   crate is not published, and `note` says so instead.
# - `layer` and `sig`: where it sits in the stack, and the signal colour that wires it (power, usb, can, bus,
#   analog, ctrl).
# - `wip`: work in progress, not finished; the card says so.
# - `logo_dark` and `logo_light`: the logo for each theme, under static/; `logo_w` and `logo_h` its shown size in px.
#   No logo: a text card.
# - `title`: the product name the card shows (WireWeaver, ShrinkWrap, ExactUnits); without it the crate's name.
# - `lang`: the code fence language of `code`.
# - `code`: the sample at 44 columns; `code_wide`: the same code with natural line breaks, up to `wide` columns (50,
#   60, 70 or 80). tools/samples.py checks that they are the same code.

[[crate]]
name = "wire_weaver"
title = "WireWeaver"
fits = true
crate = "wire_weaver"
layer = "API"
sig = "usb"
front = true
logo_dark = "img/oss/wire_weaver-dark.svg"
logo_light = "img/oss/wire_weaver-light.svg"
logo_w = 96
logo_h = 96
pitch = "WireWeaver designs no_std APIs for devices: RPC, streams and properties, built from composable API traits and compatible backwards and forwards. It generates the server and the client, blocking or async, for Rust and Python, over USB, Ethernet and CAN bus. Introspection gives dynamic Python clients, and a standard library of traits covers GPIO, CAN, firmware update, logs and more. It is approaching its alpha release."
repo = "https://github.com/vhrdtech/wire_weaver"
docs = "https://vhrdtech.github.io/wire_weaver/"
lang = "rust"
code = '''
#[ww_trait]
#[claim(exclusive)]
pub trait Uart {
    #[counted]
    stream!(rx: RxChunk<'i>);

    #[credit]
    sink!(tx: MaxLen<RefVec<'i, u8>,
                     UART_TX_MAX>);

    fn capabilities() -> Capabilities<'i>;
}
'''
