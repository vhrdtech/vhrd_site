# The open-source crates, in the order the /open-source page shows them. The front page shows those with
# `front = true`, in the same order. Facts come from each crate's README; code samples are taken from the crate's
# README, book or examples, shortened only.
#
# - `crate`: the crates.io name. Both pages fetch its version and downloads at build time; leave it out while the
#   crate is not published, and `note` says so instead.
# - `layer` and `sig`: where it sits in the stack, and the signal colour that wires it (power, usb, can, bus,
#   analog, ctrl).
# - `wip`: work in progress, not finished; the card says so.
# - `logo_dark` and `logo_light`: the logo for each theme, under static/; `logo_w` and `logo_h` its shown size in px.
#   No logo: a text card.
# - `lang`: the code fence language of `code`.

