# Real runs of our tools for /software, recorded by tools/term_capture.py into data/term/ID.html (the screen) and
# ID.toml (the command, version, source and date). Never edited by hand: change a line here and record it again.
#
# - `cmd`: the command as typed and shown; `cwd`: where it runs (under this repo, or ~/... for another checkout);
#   `repo`: the checkout it runs in, named on the page with its commit.
# - `wide`: the terminal's width on a desktop, wide enough that no line wraps (the tool stops when one fills it); every
#   capture is also recorded at 44 columns for a phone. A program that ends by itself is kept whole, however long.
# - `version`: the command whose first line names the version (default: the program with --version); `source`: what
#   it ran on, when that is not the checkout `cwd` is in.
# - `show`: a file the run read, shown above the output with the line the output points at marked.
# - `remap`: [from, to] pairs for rustc's --remap-path-prefix, so paths read as on any machine; `target`: the cargo
#   target dir under this repo.
# - `cast = true`: recorded on a bench with its hardware (asciicast v2, `--cast ID=FILE`), trimmed to start where the
#   program takes over the full screen; replayed to second `at` (from that point, not from the recording's own
#   start) for the static fallback. `version` and `source` are then the recording's notes, and it has the one width
#   it was recorded at. `live = true` also ships the trimmed recording itself (static/term/ID.cast) for the
#   browser's own asciinema-player.

[[capture]]
id = "cnt-tui"
cast = true
live = true
at = 21.0
cmd = ["cnt", "tui", "--chip", "STM32H725IGKx"]
version = "cnt_cli 0.5.1 (8b1e1db)"
source = "a B135 board through a J-Link, running cnt's demo firmware (examples/b135_demo): a made-up instrument with a USB transfer, a CAN bus-off and a USB bus reset that clears its counters"

[[capture]]
id = "ww-api-tree"
cmd = ["ww", "api", "tree", "-d", "examples/all_gpio_api"]
cwd = "~/git/wire_weaver"
repo = "wire_weaver"
wide = 160

[[capture]]
id = "bedrock-lint"
cmd = ["bedrock-lint", "check"]
cwd = "~/git/cnt/fixtures/counters_fw"
repo = "cnt"
source = "the cnt test firmware (cnt/fixtures/counters_fw)"
wide = 240

[[capture]]
id = "exact-units-error"
cmd = ["cargo", "build", "-q"]
cwd = "tools/term/units_demo"
show = "src/main.rs"
repo = "vhrd_site"
source = "tools/term/units_demo against exact_units at 90d25ff"
wide = 300
version = ["rustc", "--version"]
remap = [["~/.cargo", "~/.cargo"], ["{sysroot}/lib/rustlib/src/rust", "/rustc/{commit}"]]
target = "target/term"

[[capture]]
id = "ww-api-check"
steps = [["ww", "api", "check", "compatible"], ["ww", "api", "check", "breaking"]]
cwd = "tools/term/ww_evolution"
repo = "vhrd_site"
source = "wire_weaver's blinky_api example, saved at 0.1.0: a trailing #[default] argument bumped to 0.2.0, a required one left at 0.1.1 (tools/term/ww_evolution)"
wide = 220
