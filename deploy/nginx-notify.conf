# The notify service behind the signup forms (AGENTS.md "Notify service"). Goes into the vhrd.tech server { } in
# /etc/nginx/conf.d/vhrd.tech.conf, beside the static site's `location /`, replacing the earlier
# `location = /api/notify` block; then `nginx -t` and a reload.
# The signup and the links' endpoints reach the service; the rest of /api/ is the site's 404. Only POST, except the
# one-click unsubscribe URL, whose GET the service answers with a redirect to the page with the button.
location ~ ^/api/notify(/confirm|/remove|/unsubscribe)?$ {
    limit_except GET POST { deny all; }
    client_max_body_size 1k;
    # the one-click unsubscribe URL holds a remove token in its query: no access log here (the service logs counts)
    access_log off;
    proxy_pass http://127.0.0.1:8471;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # the service's rate limit counts by this (its settings: client_ip_header)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}
location /api/ { return 404; }
