# The notify service behind the signup forms (README "Notify service"). Goes into the vhrd.tech server { } in
# /etc/nginx/conf.d/vhrd.tech.conf, beside the static site's `location /`; then `nginx -t` and a reload.
# Only POST /api/notify reaches the service; the rest of /api/ is the site's 404.
location = /api/notify {
    limit_except POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8471;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # the service's rate limit counts by this (its settings: client_ip_header)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}
location /api/ { return 404; }
