# Goes into the vhrd.tech https server { } beside `location /`, with deploy/nginx-og.conf installed; then
# `nginx -t` and a reload (AGENTS.md "Link previews"). The og:image URL answers with the file $og_default names
# for this User-Agent, and says so in Vary for any cache on the way.
location = /img/og/default-6.jpg {
    try_files $og_default =404;
    add_header Vary User-Agent always;
    # An add_header here stops this location inheriting the server block's own: repeat every add_header line the
    # server block has (on 10 Nov 2026 only this one answered).
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# The twitter:image URL: try_files changes the internal URI to whatever $og_twitter names, so Content-Type
# follows the file actually served, not this location's own .png suffix (verified in a local nginx test).
location = /img/og/default-6.png {
    try_files $og_twitter =404;
    add_header Vary User-Agent always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
