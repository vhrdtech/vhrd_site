# The site's default share image, in two designs at one URL (AGENTS.md "Link previews"). Installed as
# /etc/nginx/conf.d/vhrd.tech-og.conf (http level); the location that uses it is deploy/nginx-og-location.conf.
# LinkedIn (its organic posts' small thumbnail) and WhatsApp crop og:image to its centre square, which cuts the
# wide card's headline and wordmark in half. Those two crawlers get default-square-6.jpg, the same 1200x627
# canvas with the whole design inside its centre square; everyone else gets the wide card. The HTML stays
# static and the same for everyone. The names follow tools/og_images.py's ROUND.
map $http_user_agent $og_default {
    default         /img/og/default-6.jpg;
    ~*LinkedInBot   /img/og/default-square-6.jpg;
    ~*WhatsApp      /img/og/default-square-6.jpg;
}
