# The site's default share image, in two designs at one URL (AGENTS.md "Link previews"). Installed as
# /etc/nginx/conf.d/vhrd.tech-og.conf (http level); the location that uses it is deploy/nginx-og-location.conf.
# LinkedIn (its organic posts' small thumbnail) and WhatsApp crop og:image to its centre square, which cuts the
# wide card's headline and wordmark in half. Those two crawlers get default-square.jpg, the same 1200x627
# canvas with the whole design inside its centre square; everyone else gets the wide card. The HTML stays
# static and the same for everyone. The names are fixed: a changed image gets a new URL from the `?v=` the pages
# add (tools/og_version.py), so this file does not change with the images.
map $http_user_agent $og_default {
    default         /img/og/default.jpg;
    ~*LinkedInBot   /img/og/default-square.jpg;
    ~*WhatsApp      /img/og/default-square.jpg;
}

# twitter:image is the dark-look transparent PNG made for X's own light/dark theme (AGENTS.md "Link
# previews"): a crawler that composites it onto its own white page instead, like Telegram's and Discord's,
# draws the white headline on white and loses it (seen 11 Nov 2026). Those crawlers get the light JPEG card
# instead, the same file og:image already sends; X keeps the PNG it was designed for. ORDER MATTERS:
# Telegram's own User-Agent is "TelegramBot (like TwitterBot)", so the TelegramBot pattern must come before
# Twitterbot's, matched in the order written — nginx map regexes are tried top to bottom, first match wins.
map $http_user_agent $og_twitter {
    default         /img/og/default.jpg;
    ~*TelegramBot   /img/og/default.jpg;
    ~*Twitterbot    /img/og/default.png;
}
