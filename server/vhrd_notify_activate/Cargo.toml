[package]
name = "vhrd_notify_activate"
description = "Activates a vhrd_notify release the Deploy workflow uploaded: checks it as untrusted input, switches, checks the service, rolls back"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vhrd_notify_activate"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rustix.workspace = true
serde.workspace = true
sha2.workspace = true
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
libtest-mimic.workspace = true
sha2.workspace = true

# its own harness: the test binary is also the fake systemctl and the fake service the activator drives
[[test]]
name = "activate"
harness = false
