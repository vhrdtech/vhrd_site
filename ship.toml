# What `tpm ship web-server vhrd_notify` (just deploy-notify) builds and installs: the notify service as a user unit
# of the web server's login user, releases in ~/vhrd_notify/releases/, the settings beside them (AGENTS.md "Notify
# service").
bin = "vhrd_notify"
dir = "vhrd_notify"
build = ["--target", "x86_64-unknown-linux-musl", "-p", "vhrd_notify_cli"]
service = "vhrd-notify"

[node.web-server]
unit = "deploy/vhrd-notify.service"
files = { "deploy/notify.toml" = "vhrd_notify/notify.toml" }
